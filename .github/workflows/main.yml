name: CI Package

on:
  # Manual only while the 1.2.0 work is prepared in the open repository.
  # Restore the push trigger when the release is ready:
  #   push:
  #     branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: npm install, lint, test, and build
       run: |
         npm install
         npm run lint
         npx vitest run
         npm run build

     - name: Package
       run: npx vsce package --out .

     - name: Archive production artifacts
       uses: actions/upload-artifact@v4
       with:
         name: vsix
         path: |
           *.vsix
