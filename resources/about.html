<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Magnus</title>
</head>

<style>
    body {
        color: var(--vscode-foreground);
        font-size: var(--vscode-font-size);
        font-weight: var(--vscode-font-weight);
        font-family: var(--vscode-font-family);
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        margin: 0;
        padding: 4px 0;
    }

    .link {
        padding: 4px 20px;
        cursor: pointer;
    }

    .link:hover {
        background-color: var(--vscode-list-hoverBackground);
    }

    .logo-container {
        text-align: center;
        padding: 12px 0 4px;
    }

    .logo-container .logo {
        width: 100%;
        max-width: 140px;
        pointer-events: none;
    }

    body.vscode-light .logo-container .logo {
        filter: brightness(30%);
    }

    body.vscode-dark .logo-container .logo {
        filter: brightness(70%);
    }

    body.vscode-high-contrast .logo-container .logo {
        filter: brightness(100%);
    }

    body.vscode-high-contrast-light .logo-container .logo {
        filter: brightness(0%);
    }
</style>

<body oncontextmenu="return false;">
    <div class="link js-getting-started">Getting started</div>
    <div class="link js-read-documentation">Documentation</div>
    <div class="link js-report-issue">Report issue</div>
    <div class="logo-container">
        <img src="./triumph-logo-white.svg" class="logo" />
    </div>
</body>

<script lang="javascript">
    (function () {
        const vscode = acquireVsCodeApi();

        document.querySelector(".js-getting-started").addEventListener("click", () => {
            vscode.postMessage({
                command: "getting-started"
            });
        });

        document.querySelector(".js-read-documentation").addEventListener("click", () => {
            vscode.postMessage({
                command: "read-documentation"
            });
        });

        document.querySelector(".js-report-issue").addEventListener("click", () => {
            vscode.postMessage({
                command: "report-issue"
            });
        });
    })();
</script>

</html>
